<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Hub">
  <title>AI Hub</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="/icons/icon.svg" alt="" width="28" height="28">
      <h1>AI Hub</h1>
      <span id="mode" class="pill" hidden></span>
    </div>
    <div class="actions">
      <span id="updated" class="muted small"></span>
      <button id="refresh" class="icon-btn" type="button" aria-label="Refresh" title="Refresh">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 4a8 8 0 0 1 7.7 5.8l1.9-.6A10 10 0 0 0 4 6.3V3H2v7h7V8H5.4A8 8 0 0 1 12 4Zm0 16a8 8 0 0 1-7.7-5.8l-1.9.6A10 10 0 0 0 20 17.7V21h2v-7h-7v2h3.6A8 8 0 0 1 12 20Z"/></svg>
      </button>
      <button id="signout" class="icon-btn" type="button" aria-label="Sign out" title="Sign out" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 3H4a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h6v-2H5V5h5V3Zm6.6 4.6L15.2 9l2 2H9v2h8.2l-2 2 1.4 1.4L21 12l-4.4-4.4Z"/></svg>
      </button>
    </div>
  </header>

  <main id="app">
    <section id="signin" class="signin" hidden>
      <form id="signin-form" class="card">
        <h2>Sign in</h2>
        <p class="muted">Enter the hub passcode.</p>
        <input id="passcode" type="password" autocomplete="current-password" inputmode="text" placeholder="Passcode" required>
        <button type="submit" class="primary">Unlock</button>
        <p id="signin-error" class="error" role="alert" hidden></p>
      </form>
    </section>

    <div id="hub" class="hub" hidden>
      <section class="panel span-all" aria-labelledby="h-latest">
        <h2 id="h-latest">Latest per tool</h2>
        <div id="latest" class="latest-grid"></div>
      </section>

      <section class="panel" aria-labelledby="h-feed">
        <div class="panel-head">
          <h2 id="h-feed">Feed</h2>
          <select id="area-filter" aria-label="Filter by area"><option value="">All areas</option></select>
        </div>
        <div id="tool-filter" class="chips" role="group" aria-label="Filter by tool"></div>
        <ol id="feed" class="feed"></ol>
      </section>

      <div class="stack">
        <section class="panel" aria-labelledby="h-handoffs">
          <h2 id="h-handoffs">Open handoffs <span id="handoff-count" class="count"></span></h2>
          <ul id="handoffs" class="handoffs"></ul>
        </section>

        <section class="panel" aria-labelledby="h-owners">
          <h2 id="h-owners">Owners</h2>
          <div class="table-wrap"><table id="owners" class="owners">
            <thead><tr><th>Area</th><th>Owner</th><th>Cadence</th><th>Last seen</th></tr></thead>
            <tbody></tbody>
          </table></div>
        </section>
      </div>
    </div>

    <p id="error" class="banner error" role="alert" hidden></p>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
